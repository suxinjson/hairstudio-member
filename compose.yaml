services:
  migrate:
    build:
      context: .
      target: api
    command: ["node", "server/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?请指定外部 PostgreSQL 的新数据库和迁移凭据}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?请设置独立的应用数据库随机密码}
      RECOVERY_DATABASE_PASSWORD: ${RECOVERY_DATABASE_PASSWORD:-}
      RELEASE_DIRECTORY: /app/releases
      RELEASE_CERT_SHA256: ${RELEASE_CERT_SHA256:-}
    volumes: ["packages:/app/releases"]
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请指定外部 PostgreSQL 的 member_app 连接串}
      RECOVERY_DATABASE_URL: ${RECOVERY_DATABASE_URL:-}
      TRUSTED_PROXY_IPS: ${MEMBER_PROXY_IP:-172.30.184.10}
      ALLOWED_ORIGINS: https://localhost,https://${PUBLIC_DOMAIN:?请设置公网域名}
      VOICE_ALLOWED_ORIGINS: ${VOICE_ALLOWED_ORIGINS:-}
      ALIGENIE_LOG_ENABLED: ${ALIGENIE_LOG_ENABLED:-true}
      XFYUN_APP_ID: ${XFYUN_APP_ID:-}
      XFYUN_API_PASSWORD: ${XFYUN_API_PASSWORD:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      RELEASE_DIRECTORY: /app/releases
      RELEASE_CERT_SHA256: ${RELEASE_CERT_SHA256:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes: ["packages:/app/releases:ro"]
    networks: [private, egress]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
  web:
    build:
      context: .
      target: web
      args:
        VITE_CLOUD_SERVER_URL: ${VITE_CLOUD_SERVER_URL:-https://124.70.184.136}
        VITE_LICENSE_PUBLIC_KEYS: ${VITE_LICENSE_PUBLIC_KEYS:-}
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?请设置公网域名}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    depends_on: [api]
    networks:
      private:
        ipv4_address: ${MEMBER_PROXY_IP:-172.30.184.10}
      public: {}
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
volumes:
  packages:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${MEMBER_PRIVATE_SUBNET:-172.30.184.0/24}
  public:
  egress:
