name: 自动编译安卓安装包(APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译安装包与自动发布
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      SERVER_DEPLOY_ENABLED: ${{ secrets.SERVER_SSH_KEY != '' }}

    steps:
    - name: 1. 拉取项目源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: 2. 安装 Node.js 22
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'

    - name: 3. 安装 Java 21 (Capacitor 7 官方要求)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: 4. 安装锁定依赖并运行测试
      run: npm ci && npm test

    - name: 5. 编译前端离线资产
      run: npm run build

    - name: 6. 配置发布签名
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        KEYSTORE_PATH="$RUNNER_TEMP/hairstudio-release.jks"
        SIGNING_CONFIG_MISSING=0
        for SIGNING_VAR in SIGNING_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
          if [ -z "${!SIGNING_VAR}" ]; then
            echo "::error::Missing $SIGNING_VAR; release builds require a fixed signing key and certificate fingerprint"
            SIGNING_CONFIG_MISSING=1
          fi
        done
        if [ "$SIGNING_CONFIG_MISSING" -ne 0 ]; then
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置四个 Secrets 和 RELEASE_CERT_SHA256 Variable；详细步骤见 deploy/github-apk.md"
          exit 1
        fi
        EXPECTED_FINGERPRINT=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]')
        [[ "$EXPECTED_FINGERPRINT" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::Invalid RELEASE_CERT_SHA256"; exit 1; }
        printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

    - name: 7. 接受 Android SDK 协议与修复执行权限
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sed -i -e 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: 8. 执行 Gradle 编译生成 APK
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew validateReleaseSigning assembleRelease --no-daemon --stacktrace

    - name: 清理发布签名临时文件
      if: ${{ always() }}
      run: rm -f -- "$RUNNER_TEMP/hairstudio-release.jks"

    - name: 9. 校验 APK 签名
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        APK="android/app/build/outputs/apk/release/app-release.apk"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -x "$APKSIGNER"
        SIGNER_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
        printf '%s\n' "$SIGNER_INFO"
        ACTUAL_FINGERPRINT=$(printf '%s\n' "$SIGNER_INFO" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        EXPECTED_FINGERPRINT=$(printf '%s\n' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        test -n "$ACTUAL_FINGERPRINT" && test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
          echo "::error::APK signing certificate does not match RELEASE_CERT_SHA256; refusing to publish an incompatible update (actual: '${ACTUAL_FINGERPRINT:-<empty>}', expected: '$EXPECTED_FINGERPRINT')"
          exit 1
        }

    - name: 10. 收集生成好的 APK
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        mkdir -p output_apk
        cp android/app/build/outputs/apk/release/app-release.apk "output_apk/hairstudio-member-v${VERSION_NAME}.apk"
        export APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        node tools/update-manifest.js "output_apk/hairstudio-member-v${VERSION_NAME}.apk" output_apk/update-manifest.json

    - name: 11. 打包生成服务器更新包
      run: |
        mkdir -p deploy_bundle/releases
        cp -r server src deploy Dockerfile compose.yaml package.json package-lock.json capacitor.config.json index.html vite.config.js .dockerignore deploy_bundle/
        cp "output_apk/hairstudio-member-v${VERSION_NAME}.apk" deploy_bundle/releases/
        cp output_apk/update-manifest.json deploy_bundle/releases/
        printf '%s\n' "$VERSION_CODE" > deploy_bundle/release-version.txt
        chmod +x deploy_bundle/deploy/deploy-update.sh
        tar -czf "output_apk/server-update-v${VERSION_NAME}.tar.gz" -C deploy_bundle .

    - name: 12. 上传安装包与服务端更新产物供备用下载
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: hairstudio-member-${{ env.VERSION_NAME }}
        path: output_apk/*
        retention-days: 30

    - name: 13. [方案B] 自动 SSH 远程部署到云服务器并发布新版 APK
      if: ${{ env.SERVER_DEPLOY_ENABLED == 'true' }}
      env:
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST || '124.70.184.136' }}
        SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '~/member' }}
        SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        if [ -z "$SERVER_KNOWN_HOSTS" ]; then
          echo "::error::Missing SERVER_KNOWN_HOSTS; configure the verified SSH host public key (see deploy/github-apk.md)"
          exit 1
        fi
        echo ">>> 检测到已配置 SERVER_SSH_KEY，开始通过 SSH 自动部署到 $SERVER_HOST..."
        SSH_KEY_PATH="$RUNNER_TEMP/member-deploy-key"
        printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_PATH"
        chmod 600 "$SSH_KEY_PATH"
        KNOWN_HOSTS="$RUNNER_TEMP/member-deploy-known-hosts"
        printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$KNOWN_HOSTS"
        chmod 600 "$KNOWN_HOSTS"
        HOST_MATCH="$SERVER_HOST"
        if [ "$SERVER_PORT" != '22' ]; then HOST_MATCH="[$SERVER_HOST]:$SERVER_PORT"; fi
        ssh-keygen -F "$HOST_MATCH" -f "$KNOWN_HOSTS" > /dev/null || { echo "::error::No pinned SSH host key for $HOST_MATCH; configure SERVER_KNOWN_HOSTS (see deploy/github-apk.md)"; exit 1; }

        SSH_OPTS=(-i "$SSH_KEY_PATH" -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o BatchMode=yes -o ConnectTimeout=30)
        SCP_OPTS=(-i "$SSH_KEY_PATH" -P "$SERVER_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o BatchMode=yes -o ConnectTimeout=30)
        REMOTE_BUNDLE="/tmp/member-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
        REMOTE_INSTALLER="/tmp/member-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

        # 传输部署更新包
        echo ">>> [1/2] 上传服务器升级包到临时目录..."
        scp "${SCP_OPTS[@]}" "output_apk/server-update-v${VERSION_NAME}.tar.gz" "$SERVER_USER@$SERVER_HOST:$REMOTE_BUNDLE"
        scp "${SCP_OPTS[@]}" deploy/install-update.sh "$SERVER_USER@$SERVER_HOST:$REMOTE_INSTALLER"

        # 远程解压并运行一键更新发布脚本
        echo ">>> [2/2] 正在远程解压、重启容器并发布最新 APK..."
        printf -v REMOTE_COMMAND 'bash %q %q %q' "$REMOTE_INSTALLER" "$SERVER_DEPLOY_PATH" "$REMOTE_BUNDLE"
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "$REMOTE_COMMAND"
        printf -v CLEANUP_COMMAND 'rm -f -- %q %q' "$REMOTE_INSTALLER" "$REMOTE_BUNDLE"
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "$CLEANUP_COMMAND"
        echo ">>> 🎉 云服务器自动部署及 APK 发布成功完成！手机端已可检查更新！"

    - name: 清理 SSH 部署临时凭据
      if: ${{ always() }}
      run: rm -f -- "$RUNNER_TEMP/member-deploy-key" "$RUNNER_TEMP/member-deploy-known-hosts"
