name: 自动编译安卓安装包(APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译安装包
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
    - name: 1. 拉取项目源码
      uses: actions/checkout@v4

    - name: 2. 安装 Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 3. 安装 Java 21 (Capacitor 7 官方要求)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: 4. 安装锁定依赖并运行测试
      run: npm ci && npm test

    - name: 5. 编译前端离线资产
      run: npm run build

    - name: 6. 配置发布签名
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        KEYSTORE_PATH="$RUNNER_TEMP/hairstudio-release.jks"
        if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
          echo "检测到自定义发布签名秘钥，正在配置..."
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "HAS_CUSTOM_SIGNING=true" >> "$GITHUB_ENV"
        else
          echo "未配置仓库秘钥，正在自动生成专用安全签名..."
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias hairstudio -keyalg RSA -keysize 2048 -validity 10000 -storepass hairstudio123 -keypass hairstudio123 -dname "CN=MengfeiHairStudio, OU=App, O=HairStudio, L=Beijing, S=Beijing, C=CN"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=hairstudio123" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=hairstudio" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=hairstudio123" >> "$GITHUB_ENV"
          echo "HAS_CUSTOM_SIGNING=false" >> "$GITHUB_ENV"
        fi

    - name: 7. 接受 Android SDK 协议与修复执行权限
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sed -i -e 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: 8. 执行 Gradle 编译生成 APK
      run: |
        cd android
        ./gradlew validateReleaseSigning assembleRelease --no-daemon --stacktrace

    - name: 9. 校验 APK 签名
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        APK="android/app/build/outputs/apk/release/app-release.apk"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -x "$APKSIGNER"
        SIGNER_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
        printf '%s\n' "$SIGNER_INFO"
        if [ "$HAS_CUSTOM_SIGNING" = "true" ] && [ -n "$RELEASE_CERT_SHA256" ]; then
          ACTUAL_FINGERPRINT=$(printf '%s\n' "$SIGNER_INFO" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_FINGERPRINT=$(printf '%s\n' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL_FINGERPRINT" && test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
            echo "::error::APK signing certificate does not match RELEASE_CERT_SHA256; refusing to publish an incompatible update"
            exit 1
          }
        else
          echo "签名校验通过，成功生成已签名发布版 APK"
        fi

    - name: 10. 收集生成好的 APK
      run: |
        mkdir -p output_apk
        cp android/app/build/outputs/apk/release/app-release.apk "output_apk/hairstudio-member-v${VERSION_NAME}.apk"

    - name: 11. 上传安装包供直接下载
      uses: actions/upload-artifact@v4
      with:
        name: hairstudio-member-${{ env.VERSION_NAME }}
        path: output_apk/hairstudio-member-v*.apk
        retention-days: 30
