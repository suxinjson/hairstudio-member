name: 编译安装包与服务器部署

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      operation:
        description: 'build_apk=编译下载；deploy_server=仅部署服务器；deploy_server_and_app=服务器和手机版一起发布'
        type: choice
        options:
          - build_apk
          - deploy_server
          - deploy_server_and_app
        default: build_apk
      apk_type:
        description: '安装包类型（仅部署服务器时忽略）：release 用于覆盖升级，debug 用于测试'
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: member-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译安装包或部署服务器
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: member_test
          POSTGRES_PASSWORD: member_test
          POSTGRES_DB: member_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U member_test -d member_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      APK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && (inputs.apk_type == 'release' || inputs.operation == 'deploy_server_and_app') && 'release' || 'debug' }}
      SERVER_ONLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_server' }}
      SERVER_DEPLOY_ENABLED: ${{ secrets.SERVER_SSH_KEY != '' }}
      RELEASE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_server_and_app' && vars.RELATIONAL_RELEASE_APPROVED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      SERVER_ONLY_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_server' && vars.RELATIONAL_RELEASE_APPROVED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
    - name: 1. 拉取项目源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: 检查安装包类型与发布状态
      env:
        RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_server_and_app' }}
      run: |
        if [ "$SERVER_ONLY_REQUESTED" = 'true' ] || [ "$RELEASE_REQUESTED" = 'true' ]; then
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/master) ;;
            *) echo '::error::服务器部署只允许从 main/master 执行'; exit 1 ;;
          esac
          if [ "$SERVER_ONLY_APPROVED" != 'true' ] && [ "$RELEASE_APPROVED" != 'true' ]; then
            echo '::error::服务器部署尚未批准；请核验后将仓库 Variable RELATIONAL_RELEASE_APPROVED 设为 true'
            exit 1
          fi
          if [ "$SERVER_DEPLOY_ENABLED" != 'true' ]; then
            echo '::error::服务器部署缺少 SERVER_SSH_KEY；请配置现有部署密钥和 SERVER_KNOWN_HOSTS'
            exit 1
          fi
        fi
        if [ "$SERVER_ONLY_REQUESTED" != 'true' ] && [ "$APK_VARIANT" = 'release' ]; then
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/master) ;;
            *) echo '::error::正式签名包只允许从 main/master 编译；其他分支请选择 debug'; exit 1 ;;
          esac
        fi
        {
          echo '## 本次安装包'
          echo "编译类型：$APK_VARIANT"
          if [ "$SERVER_ONLY_APPROVED" = 'true' ]; then
            echo '仅更新服务器 Web 与 API，不编译 APK，不发布手机版更新。'
          elif [ "$RELEASE_APPROVED" = 'true' ]; then
            echo '编译成功后执行已批准的服务器发布。'
          else
            echo '本次仅编译并上传安装包，可在 Artifacts 下载。'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 2. 安装 Node.js 22
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'

    - name: 3. 安装 Java 21 (Capacitor 7 官方要求)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: 4. 安装锁定依赖并运行测试
      env:
        MEMBER_TEST_DATABASE_URL: postgresql://member_test:member_test@localhost:5432/member_test
        MEMBER_TEST_ADMIN_DATABASE_URL: postgresql://member_test:member_test@localhost:5432/member_test
        MEMBER_RELATIONAL_TEST_DATABASE_URL: postgresql://member_test:member_test@localhost:5432/member_test
        MEMBER_TEST_DATABASE_DISPOSABLE: '1'
      run: npm ci && npm test

    - name: 4a. 关系化真实 PostgreSQL 并发验收
      env:
        MEMBER_TEST_ADMIN_DATABASE_URL: postgresql://member_test:member_test@localhost:5432/member_test
        MEMBER_RELATIONAL_TEST_DATABASE_URL: postgresql://member_test:member_test@localhost:5432/member_test
        MEMBER_TEST_DATABASE_DISPOSABLE: '1'
      run: npm run refactor:test:postgres

    - name: 4b. 关系化运行依赖与部署审计
      run: npm run refactor:audit

    - name: 5. 编译前端离线资产
      env:
        VITE_LICENSE_PUBLIC_KEYS: ${{ vars.LICENSE_PUBLIC_KEYS }}
      run: |
        if [ "$SERVER_ONLY_REQUESTED" = 'true' ]; then
          npm run build:web
        else
          npm run build
        fi
        npm run admin:build
        node scripts/check-public-credentials.mjs

    - name: 6. 配置发布签名
      if: ${{ env.SERVER_ONLY_REQUESTED != 'true' && env.APK_VARIANT == 'release' }}
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        KEYSTORE_PATH="$RUNNER_TEMP/hairstudio-release.jks"
        SIGNING_CONFIG_MISSING=0
        for SIGNING_VAR in SIGNING_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
          if [ -z "${!SIGNING_VAR}" ]; then
            echo "::error::Missing $SIGNING_VAR; release builds require a fixed signing key and certificate fingerprint"
            SIGNING_CONFIG_MISSING=1
          fi
        done
        if [ "$SIGNING_CONFIG_MISSING" -ne 0 ]; then
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置四个 Secrets 和 RELEASE_CERT_SHA256 Variable；详细步骤见 deploy/github-apk.md"
          exit 1
        fi
        EXPECTED_FINGERPRINT=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]')
        [[ "$EXPECTED_FINGERPRINT" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::Invalid RELEASE_CERT_SHA256"; exit 1; }
        printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

    - name: 7. 接受 Android SDK 协议与修复执行权限
      if: ${{ env.SERVER_ONLY_REQUESTED != 'true' }}
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sed -i -e 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: 8. 编译 Android 安装包与测试
      if: ${{ env.SERVER_ONLY_REQUESTED != 'true' }}
      env:
        RELEASE_STORE_PASSWORD: ${{ env.SERVER_ONLY_REQUESTED != 'true' && env.APK_VARIANT == 'release' && secrets.RELEASE_STORE_PASSWORD || '' }}
        RELEASE_KEY_ALIAS: ${{ env.SERVER_ONLY_REQUESTED != 'true' && env.APK_VARIANT == 'release' && secrets.RELEASE_KEY_ALIAS || '' }}
        RELEASE_KEY_PASSWORD: ${{ env.SERVER_ONLY_REQUESTED != 'true' && env.APK_VARIANT == 'release' && secrets.RELEASE_KEY_PASSWORD || '' }}
      run: |
        cd android
        if [ "$APK_VARIANT" = 'release' ]; then
          ./gradlew :app:validateReleaseSigning :app:assembleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac --no-daemon --stacktrace
        else
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac --no-daemon --stacktrace
        fi

    - name: 清理发布签名临时文件
      if: ${{ always() }}
      run: rm -f -- "$RUNNER_TEMP/hairstudio-release.jks"

    - name: 9. 校验 APK 签名
      if: ${{ env.SERVER_ONLY_REQUESTED != 'true' && env.APK_VARIANT == 'release' }}
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        APK="android/app/build/outputs/apk/release/app-release.apk"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -x "$APKSIGNER"
        SIGNER_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
        printf '%s\n' "$SIGNER_INFO"
        ACTUAL_FINGERPRINT=$(printf '%s\n' "$SIGNER_INFO" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        EXPECTED_FINGERPRINT=$(printf '%s\n' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        test -n "$ACTUAL_FINGERPRINT" && test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
          echo "::error::APK signing certificate does not match RELEASE_CERT_SHA256; refusing to publish an incompatible update (actual: '${ACTUAL_FINGERPRINT:-<empty>}', expected: '$EXPECTED_FINGERPRINT')"
          exit 1
        }

    - name: 10. 收集生成好的 APK
      if: ${{ env.SERVER_ONLY_REQUESTED != 'true' }}
      env:
        RELEASE_CERT_SHA256: ${{ env.APK_VARIANT == 'release' && vars.RELEASE_CERT_SHA256 || '' }}
      run: |
        mkdir -p output_apk
        if [ "$APK_VARIANT" = 'release' ]; then
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="output_apk/member-manager-v${VERSION_NAME}.apk"
        else
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="output_apk/member-manager-debug-v${VERSION_NAME}.apk"
        fi
        test -f "$APK" || { echo "::error::未找到本次编译的安装包: $APK"; exit 1; }
        cp "$APK" "$APK_DEST"
        if [ "$APK_VARIANT" = 'release' ]; then
          export APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          node tools/update-manifest.js "$APK_DEST" output_apk/update-manifest.json
        fi
        {
          echo '## 安装包下载'
          echo "安装包：$APK_DEST"
          echo '打开本次运行的 Artifacts，下载 member-manager 对应产物并解压。'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 11. 打包生成服务器更新包
      if: ${{ env.RELEASE_APPROVED == 'true' || env.SERVER_ONLY_APPROVED == 'true' }}
      run: |
        mkdir -p output_apk deploy_bundle
        cp -r admin server src deploy docs Dockerfile compose.yaml package.json package-lock.json capacitor.config.json index.html vite.config.js .dockerignore vendor deploy_bundle/
        if [ "${SERVER_ONLY_APPROVED:-false}" = 'true' ]; then
          printf '%s\n' 'server' > deploy_bundle/deployment-mode.txt
        else
          printf '%s\n' 'app' > deploy_bundle/deployment-mode.txt
          mkdir -p deploy_bundle/releases
          cp "output_apk/member-manager-v${VERSION_NAME}.apk" deploy_bundle/releases/
          cp output_apk/update-manifest.json deploy_bundle/releases/
        fi
        printf '%s\n' "$VERSION_CODE" > deploy_bundle/release-version.txt
        chmod +x deploy_bundle/deploy/deploy-update.sh
        tar -czf "output_apk/server-update-v${VERSION_NAME}.tar.gz" -C deploy_bundle .

    - name: 12. 上传安装包与服务端更新产物供备用下载
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.SERVER_ONLY_REQUESTED == 'true' && format('member-server-{0}', env.VERSION_NAME) || env.APK_VARIANT == 'release' && format('member-manager-{0}', env.VERSION_NAME) || format('member-manager-debug-{0}', env.VERSION_NAME) }}
        path: output_apk/*
        if-no-files-found: error
        retention-days: 30

    - name: 13. [方案B] 自动 SSH 部署服务器及所选发布内容
      if: ${{ (env.RELEASE_APPROVED == 'true' || env.SERVER_ONLY_APPROVED == 'true') && env.SERVER_DEPLOY_ENABLED == 'true' }}
      env:
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST || '124.70.184.136' }}
        SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '~/member' }}
        SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        if [ -z "$SERVER_KNOWN_HOSTS" ]; then
          echo "::error::Missing SERVER_KNOWN_HOSTS; configure the verified SSH host public key (see deploy/github-apk.md)"
          exit 1
        fi
        echo ">>> 检测到已配置 SERVER_SSH_KEY，开始通过 SSH 自动部署到 $SERVER_HOST..."
        SSH_KEY_PATH="$RUNNER_TEMP/member-deploy-key"
        printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_PATH"
        chmod 600 "$SSH_KEY_PATH"
        KNOWN_HOSTS="$RUNNER_TEMP/member-deploy-known-hosts"
        printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$KNOWN_HOSTS"
        chmod 600 "$KNOWN_HOSTS"
        HOST_MATCH="$SERVER_HOST"
        if [ "$SERVER_PORT" != '22' ]; then HOST_MATCH="[$SERVER_HOST]:$SERVER_PORT"; fi
        ssh-keygen -F "$HOST_MATCH" -f "$KNOWN_HOSTS" > /dev/null || { echo "::error::No pinned SSH host key for $HOST_MATCH; configure SERVER_KNOWN_HOSTS (see deploy/github-apk.md)"; exit 1; }

        SSH_OPTS=(-i "$SSH_KEY_PATH" -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=30)
        SCP_OPTS=(-i "$SSH_KEY_PATH" -P "$SERVER_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=30)
        REMOTE_BUNDLE="/tmp/member-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
        REMOTE_INSTALLER="/tmp/member-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

        # 传输部署更新包
        echo ">>> [1/2] 上传服务器升级包到临时目录..."
        scp "${SCP_OPTS[@]}" "output_apk/server-update-v${VERSION_NAME}.tar.gz" "$SERVER_USER@$SERVER_HOST:$REMOTE_BUNDLE"
        scp "${SCP_OPTS[@]}" deploy/install-update.sh "$SERVER_USER@$SERVER_HOST:$REMOTE_INSTALLER"

        # 远程解压并运行一键更新发布脚本
        echo ">>> [2/2] 正在远程解压、更新容器并执行所选部署操作..."
        printf -v REMOTE_COMMAND 'bash %q %q %q' "$REMOTE_INSTALLER" "$SERVER_DEPLOY_PATH" "$REMOTE_BUNDLE"
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "$REMOTE_COMMAND"
        printf -v CLEANUP_COMMAND 'rm -f -- %q %q' "$REMOTE_INSTALLER" "$REMOTE_BUNDLE"
        ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "$CLEANUP_COMMAND"
        if [ "${SERVER_ONLY_APPROVED:-false}" = 'true' ]; then
          echo '>>> 服务器部署成功；未发布手机版更新。'
        else
          echo '>>> 云服务器与手机版更新发布成功。'
        fi

    - name: 清理 SSH 部署临时凭据
      if: ${{ always() }}
      run: rm -f -- "$RUNNER_TEMP/member-deploy-key" "$RUNNER_TEMP/member-deploy-known-hosts"
