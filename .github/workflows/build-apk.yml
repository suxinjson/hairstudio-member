name: 自动编译安卓安装包(APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译安装包与自动发布
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

    steps:
    - name: 1. 拉取项目源码
      uses: actions/checkout@v5

    - name: 2. 安装 Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'

    - name: 3. 安装 Java 21 (Capacitor 7 官方要求)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: 4. 安装锁定依赖并运行测试
      run: npm ci && npm test

    - name: 5. 编译前端离线资产
      run: npm run build

    - name: 6. 配置发布签名
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        KEYSTORE_PATH="$RUNNER_TEMP/hairstudio-release.jks"
        SIGNING_CONFIG_MISSING=0
        for SIGNING_VAR in SIGNING_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
          if [ -z "${!SIGNING_VAR}" ]; then
            echo "::error::Missing $SIGNING_VAR; release builds require a fixed signing key and certificate fingerprint"
            SIGNING_CONFIG_MISSING=1
          fi
        done
        if [ "$SIGNING_CONFIG_MISSING" -ne 0 ]; then
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置四个 Secrets 和 RELEASE_CERT_SHA256 Variable；详细步骤见 deploy/github-apk.md"
          exit 1
        fi
        EXPECTED_FINGERPRINT=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]')
        [[ "$EXPECTED_FINGERPRINT" =~ ^[[:xdigit:]]{64}$ ]] || { echo "::error::Invalid RELEASE_CERT_SHA256"; exit 1; }
        printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
        echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
        echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
        echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

    - name: 7. 接受 Android SDK 协议与修复执行权限
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sed -i -e 's/\r$//' ./android/gradlew
        chmod +x ./android/gradlew

    - name: 8. 执行 Gradle 编译生成 APK
      run: |
        cd android
        ./gradlew validateReleaseSigning assembleRelease --no-daemon --stacktrace

    - name: 9. 校验 APK 签名
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        APK="android/app/build/outputs/apk/release/app-release.apk"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -x "$APKSIGNER"
        SIGNER_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
        printf '%s\n' "$SIGNER_INFO"
        ACTUAL_FINGERPRINT=$(printf '%s\n' "$SIGNER_INFO" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        EXPECTED_FINGERPRINT=$(printf '%s\n' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        test -n "$ACTUAL_FINGERPRINT" && test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
          echo "::error::APK signing certificate does not match RELEASE_CERT_SHA256; refusing to publish an incompatible update (actual: '${ACTUAL_FINGERPRINT:-<empty>}', expected: '$EXPECTED_FINGERPRINT')"
          exit 1
        }

    - name: 10. 收集生成好的 APK
      env:
        RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      run: |
        mkdir -p output_apk
        cp android/app/build/outputs/apk/release/app-release.apk "output_apk/hairstudio-member-v${VERSION_NAME}.apk"
        export APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        node tools/update-manifest.js "output_apk/hairstudio-member-v${VERSION_NAME}.apk" output_apk/update-manifest.json

    - name: 11. 打包生成服务器更新包
      run: |
        mkdir -p deploy_bundle/releases
        cp -r server src deploy Dockerfile compose.yaml package.json package-lock.json capacitor.config.json index.html vite.config.js .dockerignore deploy_bundle/
        cp "output_apk/hairstudio-member-v${VERSION_NAME}.apk" deploy_bundle/releases/
        cp output_apk/update-manifest.json deploy_bundle/releases/
        chmod +x deploy_bundle/deploy/deploy-update.sh
        tar -czf "output_apk/server-update-v${VERSION_NAME}.tar.gz" -C deploy_bundle .

    - name: 12. 上传安装包与服务端更新产物供备用下载
      uses: actions/upload-artifact@v6
      with:
        name: hairstudio-member-${{ env.VERSION_NAME }}
        path: output_apk/*
        retention-days: 30

    - name: 13. [方案B] 自动 SSH 远程部署到云服务器并发布新版 APK
      if: ${{ env.SERVER_SSH_KEY != '' }}
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST || '124.70.184.136' }}
        SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '~/member' }}
      run: |
        echo ">>> 检测到已配置 SERVER_SSH_KEY，开始通过 SSH 自动部署到 $SERVER_HOST..."
        mkdir -p ~/.ssh
        printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        SSH_OPTS="-i ~/.ssh/id_rsa -p $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
        SCP_OPTS="-i ~/.ssh/id_rsa -P $SERVER_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

        # 传输部署更新包
        echo ">>> [1/2] 上传服务器升级包到临时目录..."
        scp $SCP_OPTS "output_apk/server-update-v${VERSION_NAME}.tar.gz" "$SERVER_USER@$SERVER_HOST:/tmp/server-update.tar.gz"

        # 远程解压并运行一键更新发布脚本
        echo ">>> [2/2] 正在远程解压、重启容器并发布最新 APK..."
        ssh $SSH_OPTS "$SERVER_USER@$SERVER_HOST" "
          set -euo pipefail
          TARGET_DIR=\$(eval echo $SERVER_DEPLOY_PATH)
          mkdir -p \"\$TARGET_DIR\"
          tar -xzf /tmp/server-update.tar.gz -C \"\$TARGET_DIR\"
          rm -f /tmp/server-update.tar.gz
          cd \"\$TARGET_DIR\"
          bash deploy/deploy-update.sh
        "
        echo ">>> 🎉 云服务器自动部署及 APK 发布成功完成！手机端已可检查更新！"
